<!DOCTYPE html><html class="light" lang="pt-BR"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>LuxCommand - Editar Galpão</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: { "on-secondary-container": "#0a7147", "on-surface": "#181c24", "tertiary-fixed-dim": "#fbbc00", "on-tertiary": "#ffffff", "secondary-container": "#99f2bd", "on-error-container": "#93000a", "on-primary-fixed": "#001a42", "surface": "#f9f9ff", "surface-bright": "#f9f9ff", "on-primary": "#ffffff", "error-container": "#ffdad6", "surface-container": "#ebedf9", "on-secondary-fixed": "#002111", "surface-tint": "#495e8a", "inverse-on-surface": "#edf0fc", "surface-container-lowest": "#ffffff", "on-primary-container": "#7084b3", "on-secondary": "#ffffff", "on-tertiary-container": "#a97e00", "surface-container-high": "#e5e8f3", "on-surface-variant": "#44474f", "tertiary": "#040200", "secondary-fixed-dim": "#80d8a5", "on-tertiary-fixed": "#261a00", "primary-container": "#001b44", "on-background": "#181c24", "tertiary-container": "#271b00", "surface-dim": "#d7dae5", "on-tertiary-fixed-variant": "#5c4300", "surface-container-low": "#f0f3ff", "surface-variant": "#dfe2ed", "secondary": "#006d43", "background": "#f9f9ff", "outline": "#75777f", "on-secondary-fixed-variant": "#005231", "on-error": "#ffffff", "primary-fixed-dim": "#b1c6f9", "primary": "#00020a", "outline-variant": "#c5c6d0", "on-primary-fixed-variant": "#314671", "inverse-primary": "#b1c6f9", "inverse-surface": "#2c3039", "primary-fixed": "#d8e2ff", "surface-container-highest": "#dfe2ed", "error": "#ba1a1a", "secondary-fixed": "#9cf5c0", "tertiary-fixed": "#ffdfa0" },
                borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
                spacing: { "sidebar-width": "16rem", "stack-md": "1rem", "grid-gutter": "1.5rem", "container-margin": "2rem", "header-height": "4rem", "stack-sm": "0.5rem" },
                fontFamily: { "label-caps": ["Inter"], "headline-md": ["Manrope"], "body-md": ["Inter"], "title-sm": ["Manrope"], "display-lg": ["Manrope"] },
                fontSize: { "label-caps": ["10px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "700" }], "headline-md": ["30px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "800" }], "body-md": ["14px", { lineHeight: "1.6", fontWeight: "400" }], "title-sm": ["18px", { lineHeight: "1.5", fontWeight: "800" }], "display-lg": ["72px", { lineHeight: "1", fontWeight: "800" }] }
            } }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased">
<nav class="md:hidden flex justify-between items-center w-full px-8 h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm sticky top-0 z-40">
    <span class="text-xl font-bold text-blue-950 tracking-tight">LuxCommand</span>
    <div class="flex items-center gap-4">
        <button class="text-outline hover:bg-slate-50 transition-colors p-2 rounded-full"><span class="material-symbols-outlined">notifications</span></button>
        <button class="text-outline hover:bg-slate-50 transition-colors p-2 rounded-full"><span class="material-symbols-outlined">settings_suggest</span></button>
    </div>
</nav>
<aside class="hidden md:flex fixed left-0 top-0 h-full w-64 flex-col py-6 z-50" style="background-color: #001B44;">
    <div class="px-6 mb-8 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-primary-fixed flex items-center justify-center"><span class="material-symbols-outlined fill text-primary">brightness_5</span></div>
        <div><h1 class="text-lg font-black text-white leading-tight">Granja Inteligente</h1></div>
    </div>
    <nav class="flex-1 flex flex-col gap-1 px-3">
        <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 transition-all rounded-lg font-manrope text-sm" href="index.html"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
        <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 transition-all rounded-lg font-manrope text-sm" href="cadastraLotes.html"><span class="material-symbols-outlined">add_circle</span>Cadastrar Lote</a>
        <a class="flex items-center gap-3 px-4 py-3 rounded-lg font-semibold bg-white/10 text-white transition-all font-manrope text-sm" href="galpoes.html"><span class="material-symbols-outlined fill">factory</span>Galpões</a>
    </nav>
    <div class="px-3 mt-auto mb-2">
        <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 transition-all rounded-lg font-manrope text-sm" href="perfil.html"><span class="material-symbols-outlined">settings</span>Configurações</a>
    </div>
</aside>
<main class="flex-1 md:ml-sidebar-width p-container-margin md:p-8 flex flex-col gap-grid-gutter max-w-7xl mx-auto w-full">
    <header class="mb-6">
        <a href="galpoes.html" class="inline-flex items-center gap-1 text-sm text-on-surface-variant hover:text-primary-container transition-colors mb-2"><span class="material-symbols-outlined text-base">arrow_back</span> Voltar</a>
        <h2 class="font-headline-md text-headline-md text-on-surface">Editar Galpão</h2>
        <p class="font-body-md text-body-md text-on-surface-variant mt-1">Altere os dados do galpão.</p>
    </header>

    <div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_1px_3px_rgba(0,0,0,0.05)] border border-surface-variant max-w-2xl">
        <form class="space-y-6" id="galpao-form" novalidate>
            <input type="hidden" id="galpao-id">
            <div>
                <label class="block font-title-sm text-sm text-on-surface mb-2" for="nome">Nome do Galpão</label>
                <input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary-container focus:rounded-lg outline-none transition-shadow" id="nome" required type="text">
            </div>
            <div>
                <label class="block font-title-sm text-sm text-on-surface mb-2" for="capacidade">Capacidade (aves)</label>
                <input class="w-full px-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary-container focus:rounded-lg outline-none transition-shadow" id="capacidade" required type="number" min="1">
            </div>
            <div class="flex items-center justify-end gap-4 pt-4">
                <a href="galpoes.html" class="px-6 py-2.5 text-on-surface-variant font-title-sm text-sm hover:bg-surface-container transition-colors rounded-lg">Cancelar</a>
                <button class="px-8 py-2.5 bg-primary-container text-on-primary font-title-sm text-sm rounded-lg hover:shadow-lg transition-all" style="background-color: #001B44;" type="submit">Salvar</button>
            </div>
        </form>
    </div>
</main>
<div class="fixed top-8 right-8 z-[100] flex flex-col gap-4 pointer-events-none" id="toast-container"></div>
<script>
    const STORAGE_KEY = 'luxcommand_data';
    function getData() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { galpoes: [] }; } catch { return { galpoes: [] }; } }
    function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

    function getParam(name) { return new URLSearchParams(window.location.search).get(name); }

    function showToast(msg) {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'flex items-center gap-3 bg-white border border-secondary-container px-6 py-4 rounded-xl shadow-2xl pointer-events-auto min-w-[320px]';
        t.innerHTML = `<div class="w-10 h-10 bg-secondary-container text-on-secondary-container rounded-full flex items-center justify-center shrink-0"><span class="material-symbols-outlined font-bold">check</span></div><p class="font-title-sm text-sm text-on-surface">${msg}</p>`;
        c.appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        const id = getParam('id');
        if (!id) { window.location.href = 'galpoes.html'; return; }
        const data = getData();
        const galpao = data.galpoes.find(g => g.id === id);
        if (!galpao) { window.location.href = 'galpoes.html'; return; }
        document.getElementById('galpao-id').value = id;
        document.getElementById('nome').value = galpao.nome;
        document.getElementById('capacidade').value = galpao.capacidade;
    });

    document.getElementById('galpao-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('galpao-id').value;
        const nome = document.getElementById('nome').value.trim();
        const capacidade = parseInt(document.getElementById('capacidade').value);
        if (!nome || !capacidade) return;
        const data = getData();
        const idx = data.galpoes.findIndex(g => g.id === id);
        if (idx === -1) return;
        data.galpoes[idx].nome = nome;
        data.galpoes[idx].capacidade = capacidade;
        data.galpoes[idx].atualizadoEm = new Date().toISOString();
        saveData(data);
        showToast('Galpão atualizado com sucesso!');
        setTimeout(() => { window.location.href = 'galpoes.html'; }, 1000);
    });
</script>
</body></html>
