<!DOCTYPE html><html class="light" lang="pt-BR"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>LuxCommand - Galpões</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: { extend: {
                colors: { "on-secondary-container": "#0a7147", "on-surface": "#181c24", "tertiary-fixed-dim": "#fbbc00", "on-tertiary": "#ffffff", "secondary-container": "#99f2bd", "on-error-container": "#93000a", "on-primary-fixed": "#001a42", "surface": "#f9f9ff", "surface-bright": "#f9f9ff", "on-primary": "#ffffff", "error-container": "#ffdad6", "surface-container": "#ebedf9", "on-secondary-fixed": "#002111", "surface-tint": "#495e8a", "inverse-on-surface": "#edf0fc", "surface-container-lowest": "#ffffff", "on-primary-container": "#7084b3", "on-secondary": "#ffffff", "on-tertiary-container": "#a97e00", "surface-container-high": "#e5e8f3", "on-surface-variant": "#44474f", "tertiary": "#040200", "secondary-fixed-dim": "#80d8a5", "on-tertiary-fixed": "#261a00", "primary-container": "#001b44", "on-background": "#181c24", "tertiary-container": "#271b00", "surface-dim": "#d7dae5", "on-tertiary-fixed-variant": "#5c4300", "surface-container-low": "#f0f3ff", "surface-variant": "#dfe2ed", "secondary": "#006d43", "background": "#f9f9ff", "outline": "#75777f", "on-secondary-fixed-variant": "#005231", "on-error": "#ffffff", "primary-fixed-dim": "#b1c6f9", "primary": "#00020a", "outline-variant": "#c5c6d0", "on-primary-fixed-variant": "#314671", "inverse-primary": "#b1c6f9", "inverse-surface": "#2c3039", "primary-fixed": "#d8e2ff", "surface-container-highest": "#dfe2ed", "error": "#ba1a1a", "secondary-fixed": "#9cf5c0", "tertiary-fixed": "#ffdfa0" },
                borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
                spacing: { "sidebar-width": "16rem", "stack-md": "1rem", "grid-gutter": "1.5rem", "container-margin": "2rem", "header-height": "4rem", "stack-sm": "0.5rem" },
                fontFamily: { "label-caps": ["Inter"], "headline-md": ["Manrope"], "body-md": ["Inter"], "title-sm": ["Manrope"], "display-lg": ["Manrope"] },
                fontSize: { "label-caps": ["10px", { lineHeight: "1", letterSpacing: "0.1em", fontWeight: "700" }], "headline-md": ["30px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "800" }], "body-md": ["14px", { lineHeight: "1.6", fontWeight: "400" }], "title-sm": ["18px", { lineHeight: "1.5", fontWeight: "800" }], "display-lg": ["72px", { lineHeight: "1", fontWeight: "800" }] }
            } }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .material-symbols-outlined.fill { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased">
<nav class="md:hidden flex justify-between items-center w-full px-8 h-16 bg-white/80 backdrop-blur-md border-b border-slate-200 shadow-sm sticky top-0 z-40">
    <span class="text-xl font-bold text-blue-950 tracking-tight">LuxCommand</span>
    <div class="flex items-center gap-4">
        <button class="text-outline hover:bg-slate-50 transition-colors p-2 rounded-full"><span class="material-symbols-outlined">notifications</span></button>
        <button class="text-outline hover:bg-slate-50 transition-colors p-2 rounded-full"><span class="material-symbols-outlined">settings_suggest</span></button>
    </div>
</nav>
<aside class="hidden md:flex fixed left-0 top-0 h-full w-64 flex-col py-6 z-50" style="background-color: #001B44;">
    <div class="px-6 mb-8 flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-primary-fixed flex items-center justify-center">
            <span class="material-symbols-outlined fill text-primary">brightness_5</span>
        </div>
        <div><h1 class="text-lg font-black text-white leading-tight">Granja Inteligente</h1></div>
    </div>
    <nav class="flex-1 flex flex-col gap-1 px-3">
        <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 transition-all rounded-lg font-manrope text-sm" href="index.html"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
        <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 transition-all rounded-lg font-manrope text-sm" href="cadastraLotes.html"><span class="material-symbols-outlined">add_circle</span>Cadastrar Lote</a>
        <a class="flex items-center gap-3 px-4 py-3 rounded-lg font-semibold bg-white/10 text-white transition-all font-manrope text-sm" href="galpoes.html"><span class="material-symbols-outlined fill">factory</span>Galpões</a>
    </nav>
    <div class="px-3 mt-auto mb-2">
        <a class="flex items-center gap-3 px-4 py-3 text-slate-300 hover:text-white hover:bg-white/5 transition-all rounded-lg font-manrope text-sm" href="perfil.html"><span class="material-symbols-outlined">settings</span>Configurações</a>
    </div>
</aside>
<main class="flex-1 md:ml-sidebar-width p-container-margin md:p-8 flex flex-col gap-grid-gutter max-w-7xl mx-auto w-full">
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <div>
            <h2 class="font-headline-md text-headline-md text-on-surface">Galpões</h2>
            <p class="font-body-md text-body-md text-on-surface-variant mt-1">Gerencie seus galpões cadastrados.</p>
        </div>
        <a href="galpao-criar.html" class="px-6 py-2.5 bg-primary-container text-on-primary font-title-sm text-sm rounded-lg hover:shadow-lg transition-all inline-flex items-center gap-2"><span class="material-symbols-outlined text-base">add</span>Novo Galpão</a>
    </header>

    <div class="mb-4">
        <div class="relative max-w-sm">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-outline"><span class="material-symbols-outlined text-base">search</span></span>
            <input id="search-input" type="text" placeholder="Buscar por nome..." class="w-full pl-10 pr-4 py-2.5 bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-sm focus:ring-2 focus:ring-primary-container focus:rounded-lg outline-none transition-shadow">
        </div>
    </div>

    <div class="bg-surface-container-lowest rounded-xl shadow-[0_1px_3px_rgba(0,0,0,0.05)] border border-surface-variant overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead><tr class="border-b border-outline-variant/40 font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase"><th class="px-6 py-4 font-medium">Nome</th><th class="px-6 py-4 font-medium">Capacidade</th><th class="px-6 py-4 font-medium">Lotes</th><th class="px-6 py-4 font-medium">Dispositivos</th><th class="px-6 py-4 font-medium">Ações</th></tr></thead>
                <tbody id="galpoes-list"></tbody>
            </table>
        </div>
        <p class="text-center text-on-surface-variant font-body-md py-12" id="empty-msg">Nenhum galpão cadastrado. <a href="galpao-criar.html" class="text-primary-container font-semibold hover:underline">Criar primeiro galpão</a></p>
        <div class="flex items-center justify-between px-6 py-4 border-t border-outline-variant/40" id="pagination-bar">
            <span class="font-body-md text-sm text-on-surface-variant" id="pagination-info">0 de 0</span>
            <div class="flex gap-2">
                <button id="prev-page" class="px-4 py-2 border border-outline-variant rounded-lg text-sm font-title-sm text-on-surface-variant hover:bg-surface-container transition-all disabled:opacity-30 disabled:cursor-not-allowed" disabled>Anterior</button>
                <button id="next-page" class="px-4 py-2 border border-outline-variant rounded-lg text-sm font-title-sm text-on-surface-variant hover:bg-surface-container transition-all disabled:opacity-30 disabled:cursor-not-allowed" disabled>Próximo</button>
            </div>
        </div>
    </div>
</main>
<script>
    const STORAGE_KEY = 'luxcommand_data';
    function getData() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { galpoes: [] }; } catch { return { galpoes: [], dispositivos: [] }; } }
    function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

    let currentPage = 1;
    const ITEMS_PER_PAGE = 10;

    function renderList() {
        const data = getData();
        const galpoes = data.galpoes || [];
        const searchTerm = (document.getElementById('search-input').value || '').toLowerCase().trim();
        const filtered = searchTerm ? galpoes.filter(g => g.nome.toLowerCase().includes(searchTerm)) : galpoes;
        const total = filtered.length;
        const totalPages = Math.max(1, Math.ceil(total / ITEMS_PER_PAGE));
        if (currentPage > totalPages) currentPage = totalPages;
        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const end = Math.min(start + ITEMS_PER_PAGE, total);
        const pageItems = filtered.slice(start, end);

        const tbody = document.getElementById('galpoes-list');
        const empty = document.getElementById('empty-msg');
        const paginationBar = document.getElementById('pagination-bar');
        tbody.innerHTML = '';
        if (pageItems.length === 0) {
            empty.style.display = 'block';
            paginationBar.style.display = 'none';
            return;
        }
        empty.style.display = 'none';
        paginationBar.style.display = 'flex';
        pageItems.forEach((g) => {
            const tr = document.createElement('tr');
            tr.className = 'border-b border-outline-variant/20 hover:bg-surface-container-low/50 transition-colors';
            tr.innerHTML = `
                <td class="px-6 py-4"><a href="galpao-detalhe.html?id=${g.id}" class="font-body-md text-sm text-primary-container hover:underline font-medium">${g.nome}</a></td>
                <td class="px-6 py-4 font-body-md text-sm text-on-surface">${g.capacidade}</td>
                <td class="px-6 py-4 font-body-md text-sm text-on-surface">${g._count?.lotes || 0}</td>
                <td class="px-6 py-4 font-body-md text-sm text-on-surface">${g._count?.dispositivos || 0}</td>
                <td class="px-6 py-4"><div class="flex items-center gap-2">
                    <a href="galpao-editar.html?id=${g.id}" class="p-2 text-outline hover:text-primary-container hover:bg-surface-container rounded-lg transition-all" title="Editar"><span class="material-symbols-outlined text-base">edit</span></a>
                    <a href="galpao-detalhe.html?id=${g.id}" class="p-2 text-outline hover:text-primary-container hover:bg-surface-container rounded-lg transition-all" title="Detalhes"><span class="material-symbols-outlined text-base">visibility</span></a>
                    <button onclick="excluirGalpao('${g.id}')" class="p-2 text-outline hover:text-error hover:bg-error-container rounded-lg transition-all" title="Excluir"><span class="material-symbols-outlined text-base">delete</span></button>
                </div></td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById('pagination-info').textContent = `${start + 1}–${end} de ${total}`;
        document.getElementById('prev-page').disabled = currentPage <= 1;
        document.getElementById('next-page').disabled = currentPage >= totalPages;
    }

    document.getElementById('search-input').addEventListener('input', () => { currentPage = 1; renderList(); });
    document.getElementById('prev-page').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderList(); } });
    document.getElementById('next-page').addEventListener('click', () => {
        const data = getData();
        const searchTerm = (document.getElementById('search-input').value || '').toLowerCase().trim();
        const filtered = searchTerm ? (data.galpoes || []).filter(g => g.nome.toLowerCase().includes(searchTerm)) : (data.galpoes || []);
        if (currentPage < Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE))) { currentPage++; renderList(); }
    });

    window.excluirGalpao = function(id) {
        if (!confirm('Tem certeza que deseja excluir este galpão?')) return;
        const data = getData();
        data.galpoes = data.galpoes.filter(g => g.id !== id);
        saveData(data);
        renderList();
    };

    document.addEventListener('DOMContentLoaded', renderList);
</script>
</body></html>
