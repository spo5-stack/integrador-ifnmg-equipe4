<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#fbbc00",
                        "tertiary": "#040200",
                        "secondary": "#006d43",
                        "on-surface-variant": "#44474f",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#001b44",
                        "on-secondary-fixed": "#002111",
                        "surface-container-highest": "#dfe2ed",
                        "inverse-primary": "#b1c6f9",
                        "surface-bright": "#f9f9ff",
                        "primary-fixed-dim": "#b1c6f9",
                        "on-secondary-fixed-variant": "#005231",
                        "on-primary-fixed-variant": "#314671",
                        "inverse-on-surface": "#edf0fc",
                        "surface-container": "#ebedf9",
                        "secondary-fixed-dim": "#80d8a5",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "on-tertiary-fixed": "#261a00",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#99f2bd",
                        "tertiary-fixed": "#ffdfa0",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#a97e00",
                        "background": "#f9f9ff",
                        "surface": "#f9f9ff",
                        "on-secondary-container": "#0a7147",
                        "on-primary-fixed": "#001a42",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#00020a",
                        "inverse-surface": "#2c3039",
                        "on-primary-container": "#7084b3",
                        "surface-tint": "#495e8a",
                        "outline-variant": "#c5c6d0",
                        "surface-variant": "#dfe2ed",
                        "surface-dim": "#d7dae5",
                        "primary-fixed": "#d8e2ff",
                        "surface-container-high": "#e5e8f3",
                        "on-surface": "#181c24",
                        "secondary-fixed": "#9cf5c0",
                        "outline": "#75777f",
                        "tertiary-container": "#271b00",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f0f3ff",
                        "on-background": "#181c24"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "1rem",
                        "sidebar-width": "16rem",
                        "header-height": "4rem",
                        "stack-sm": "0.5rem",
                        "grid-gutter": "1.5rem",
                        "container-margin": "2rem"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "body-md": ["Inter"],
                        "title-sm": ["Manrope"],
                        "label-caps": ["Inter"],
                        "display-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["30px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-md": ["14px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "title-sm": ["18px", {"lineHeight": "1.5", "fontWeight": "800"}],
                        "label-caps": ["10px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "display-lg": ["72px", {"lineHeight": "1", "fontWeight": "800"}]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #f9f9ff;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col has-validation-logic">

<header class="p-8 w-full top-0 left-0 absolute">
</header>

<main class="flex-grow flex items-center justify-center px-4 min-h-screen">
    <div class="w-full max-w-[480px]">
        <div class="bg-surface-container-lowest rounded-[12px] p-10 shadow-sm border border-outline-variant flex flex-col items-center text-center">
            
            <div class="w-16 h-16 rounded-full bg-primary-container/5 flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-primary-container text-4xl" data-icon="shield_lock" data-weight="fill" style='font-variation-settings: "FILL" 1;'>shield_lock</span>
            </div>

            <h1 class="font-headline-md text-headline-md text-primary-container mb-3">
                Verificar Código
            </h1>

            <p class="font-body-md text-body-md text-on-surface-variant mb-8 max-w-[320px]">
                Insira o código de 6 dígitos enviado para o seu e-mail corporativo.
            </p>

            <div class="flex gap-3 mb-8 w-full justify-center" id="otp-container">
                <input class="w-12 h-14 text-center text-xl font-bold border border-outline-variant rounded-lg bg-surface-container-low focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" maxlength="1" inputmode="numeric" spellcheck="false" type="text"/>
                <input class="w-12 h-14 text-center text-xl font-bold border border-outline-variant rounded-lg bg-surface-container-low focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" maxlength="1" inputmode="numeric" spellcheck="false" type="text"/>
                <input class="w-12 h-14 text-center text-xl font-bold border border-outline-variant rounded-lg bg-surface-container-low focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" maxlength="1" inputmode="numeric" spellcheck="false" type="text"/>
                <input class="w-12 h-14 text-center text-xl font-bold border border-outline-variant rounded-lg bg-surface-container-low focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" maxlength="1" inputmode="numeric" spellcheck="false" type="text"/>
                <input class="w-12 h-14 text-center text-xl font-bold border border-outline-variant rounded-lg bg-surface-container-low focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" maxlength="1" inputmode="numeric" spellcheck="false" type="text"/>
                <input class="w-12 h-14 text-center text-xl font-bold border border-outline-variant rounded-lg bg-surface-container-low focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all" maxlength="1" inputmode="numeric" spellcheck="false" type="text"/>
            </div>

            <div class="text-error text-body-md font-semibold mb-6 hidden" id="error-message"></div>

            <button class="w-full py-4 bg-primary-container text-on-primary rounded-[12px] font-title-sm text-title-sm hover:opacity-90 active:scale-[0.98] transition-all shadow-md mb-8" id="verify-button">
                Verificar Código
            </button>

            <div class="flex flex-col gap-4 items-center">
                <button class="text-primary-container font-body-md text-body-md font-semibold hover:underline cursor-pointer">
                    Reenviar código
                </button>
                <div class="flex items-center gap-2 text-on-surface-variant font-body-md text-body-md">
                    <span class="material-symbols-outlined text-sm" data-icon="arrow_back">arrow_back</span>
                    <a class="hover:text-primary-container transition-colors" href="Login.html">Voltar para o login</a>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
const inputs = document.querySelectorAll('#otp-container input');
const verifyBtn = document.getElementById('verify-button');
const errorMsg = document.getElementById('error-message');

function resetError() {
    inputs.forEach(input => {
        input.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
        input.classList.add('border-outline-variant');
    });
    errorMsg.classList.add('hidden');
    errorMsg.textContent = '';
}

function showError(message) {
    inputs.forEach(input => {
        input.classList.remove('border-outline-variant');
        input.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
    });
    errorMsg.textContent = message;
    errorMsg.classList.remove('hidden');
}

inputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
        resetError();
        
        if (input.value.length > 1) {
            input.value = input.value.slice(-1);
        }

        if (input.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace') {
            resetError();
            if (!input.value && index > 0) {
                inputs[index - 1].value = '';
                inputs[index - 1].focus();
            } else {
                input.value = '';
            }
            e.preventDefault();
        }
    });

    input.addEventListener('click', () => {
        input.select();
    });
});

verifyBtn.addEventListener('click', () => {
    const code = Array.from(inputs).map(i => i.value).join('');
    
    if (code.length < 6) {
        showError('O preenchimento do código é obrigatório.');
    } else if (code !== '123456') {
        showError('Código incorreto. Por favor, verifique e tente novamente.');
    } else {
        // Redireciona para o arquivo SenhaNova.html abrindo em uma nova aba
        window.open('SenhaNova.html', '_blank');
        resetError();
    }
});
</script>
</body>
</html>
