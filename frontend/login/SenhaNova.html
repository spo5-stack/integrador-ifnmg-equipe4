<!DOCTYPE html>
<html class="light" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#fbbc00",
                        "tertiary": "#040200",
                        "secondary": "#006d43",
                        "on-surface-variant": "#44474f",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "primary-container": "#001b44",
                        "on-secondary-fixed": "#002111",
                        "surface-container-highest": "#dfe2ed",
                        "inverse-primary": "#b1c6f9",
                        "surface-bright": "#f9f9ff",
                        "primary-fixed-dim": "#b1c6f9",
                        "on-secondary-fixed-variant": "#005231",
                        "on-primary-fixed-variant": "#314671",
                        "inverse-on-surface": "#edf0fc",
                        "surface-container": "#ebedf9",
                        "secondary-fixed-dim": "#80d8a5",
                        "on-tertiary-fixed-variant": "#5c4300",
                        "on-tertiary-fixed": "#261a00",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#99f2bd",
                        "tertiary-fixed": "#ffdfa0",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#a97e00",
                        "background": "#f9f9ff",
                        "surface": "#f9f9ff",
                        "on-secondary-container": "#0a7147",
                        "on-primary-fixed": "#001a42",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#00020a",
                        "inverse-surface": "#2c3039",
                        "on-primary-container": "#7084b3",
                        "surface-tint": "#495e8a",
                        "outline-variant": "#c5c6d0",
                        "surface-variant": "#dfe2ed",
                        "surface-dim": "#d7dae5",
                        "primary-fixed": "#d8e2ff",
                        "surface-container-high": "#e5e8f3",
                        "on-surface": "#181c24",
                        "secondary-fixed": "#9cf5c0",
                        "outline": "#75777f",
                        "tertiary-container": "#271b00",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f0f3ff",
                        "on-background": "#181c24"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-md": "1rem",
                        "sidebar-width": "16rem",
                        "header-height": "4rem",
                        "stack-sm": "0.5rem",
                        "grid-gutter": "1.5rem",
                        "container-margin": "2rem"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "body-md": ["Inter"],
                        "title-sm": ["Manrope"],
                        "label-caps": ["Inter"],
                        "display-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["30px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-md": ["14px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "title-sm": ["18px", {"lineHeight": "1.5", "fontWeight": "800"}],
                        "label-caps": ["10px", {"lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "display-lg": ["72px", {"lineHeight": "1", "fontWeight": "800"}]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #f9f9ff;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col has-validation-logic">

<header class="p-8 w-full top-0 left-0 absolute">
</header>

<main class="flex-grow flex items-center justify-center px-4 min-h-screen">
    <div class="w-full max-w-[480px]">
        <div class="bg-surface-container-lowest rounded-[12px] p-10 shadow-sm border border-outline-variant flex flex-col items-center text-center">
            
            <div class="w-16 h-16 rounded-full bg-primary-container/5 flex items-center justify-center mb-6">
                <span class="material-symbols-outlined text-primary-container text-4xl" data-icon="lock_reset" data-weight="fill" style='font-variation-settings: "FILL" 1;'>lock_reset</span>
            </div>

            <h1 class="font-headline-md text-headline-md text-primary-container mb-3">
                Redefinir Senha
            </h1>

            <p class="font-body-md text-body-md text-on-surface-variant mb-8 max-w-[320px]">
                Crie uma nova senha para acessar sua conta.
            </p>

            <form action="#" class="flex flex-col gap-4 w-full" id="reset-form" method="POST" novalidate="">
                
                <div class="hidden mb-2 text-secondary flex items-center justify-center gap-2 transition-all text-center" id="success-alert">
                    <span class="material-symbols-outlined text-[20px]">check_circle</span>
                    <p class="font-body-md text-sm font-semibold">Senha redefinida com sucesso!</p>
                </div>

                <div class="flex flex-col gap-1.5 text-left">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Nova Senha</label>
                    <div class="relative w-full">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-[20px]">lock</span>
                        </div>
                        <input class="block w-full pl-10 pr-10 py-3 border border-outline-variant text-on-surface placeholder-outline focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all shadow-sm rounded-lg bg-surface-container-low" id="password" name="password" placeholder="••••••••" required type="password"/>
                        <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button" onclick="togglePassword('password', this)">
                            <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                        </button>
                    </div>
                    <div class="hidden mt-1.5" id="password-error-container">
                        <p class="text-red-500 text-[12px] font-semibold leading-normal" id="password-error"></p>
                    </div>
                </div>

                <div class="flex flex-col gap-1.5 text-left">
                    <label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="confirm-password">Confirmar Nova Senha</label>
                    <div class="relative w-full">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                            <span class="material-symbols-outlined text-[20px]">lock</span>
                        </div>
                        <input class="block w-full pl-10 pr-10 py-3 border border-outline-variant text-on-surface placeholder-outline focus:outline-none focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-all shadow-sm rounded-lg bg-surface-container-low" id="confirm-password" name="confirm-password" placeholder="••••••••" required type="password"/>
                        <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button" onclick="togglePassword('confirm-password', this)">
                            <span class="material-symbols-outlined text-[20px]">visibility_off</span>
                        </button>
                    </div>
                    <div class="hidden mt-1.5" id="confirm-password-error-container">
                        <p class="text-red-500 text-[12px] font-semibold leading-normal" id="confirm-password-error"></p>
                    </div>
                </div>

                <button class="w-full py-4 bg-primary-container text-on-primary rounded-[12px] font-title-sm text-title-sm hover:opacity-90 active:scale-[0.98] transition-all shadow-md mt-4" type="submit">
                    Redefinir Senha
                </button>
            </form>

            <div class="flex flex-col gap-4 items-center mt-8">
                <div class="flex items-center gap-2 text-on-surface-variant font-body-md text-body-md">
                    <span class="material-symbols-outlined text-sm">arrow_back</span>
                    <a class="hover:text-primary-container transition-colors" href="Login.html">Voltar para o login</a>
                </div>
            </div>

        </div>
    </div>
</main>

<script>
    const form = document.getElementById('reset-form');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    
    const passwordError = document.getElementById('password-error');
    const passwordErrorContainer = document.getElementById('password-error-container');
    
    const confirmPasswordError = document.getElementById('confirm-password-error');
    const confirmPasswordErrorContainer = document.getElementById('confirm-password-error-container');
    
    const successAlert = document.getElementById('success-alert');

    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('.material-symbols-outlined');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }

    function resetErrors() {
        [passwordInput, confirmPasswordInput].forEach(input => {
            input.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
            input.classList.add('border-outline-variant', 'focus:border-primary-container', 'focus:ring-primary-container');
        });
        passwordErrorContainer.classList.add('hidden');
        confirmPasswordErrorContainer.classList.add('hidden');
    }

    function showInputError(input, container, labelElement, message) {
        input.classList.remove('border-outline-variant', 'focus:border-primary-container', 'focus:ring-primary-container');
        // Aplica estritamente a borda border-red-500 solicitada
        input.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
        labelElement.textContent = message;
        container.classList.remove('hidden');
    }

    [passwordInput, confirmPasswordInput].forEach(input => {
        input.addEventListener('input', resetErrors);
    });

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        resetErrors();

        const passwordValue = passwordInput.value;
        const confirmPasswordValue = confirmPasswordInput.value;
        let isValid = true;

        if (!passwordValue) {
            showInputError(passwordInput, passwordErrorContainer, passwordError, 'O preenchimento da senha é obrigatório.');
            isValid = false;
        }

        if (!confirmPasswordValue) {
            showInputError(confirmPasswordInput, confirmPasswordErrorContainer, confirmPasswordError, 'O preenchimento da senha é obrigatório.');
            isValid = false;
        } else if (passwordValue && passwordValue !== confirmPasswordValue) {
            showInputError(confirmPasswordInput, confirmPasswordErrorContainer, confirmPasswordError, 'As senhas não coincidem.');
            isValid = false;
        }

        if (isValid) {
            successAlert.classList.remove('hidden');
            form.reset();
            setTimeout(() => {
                successAlert.classList.add('hidden');
            }, 4000);
        }
    });
</script>
</body>
</html>
