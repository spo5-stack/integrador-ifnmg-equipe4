<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>LuxCommand - Esqueci minha senha</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Manrope:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed": "#002111",
                      "surface-container-high": "#e5e8f3",
                      "on-primary-container": "#7084b3",
                      "on-surface": "#181c24",
                      "on-secondary-fixed-variant": "#005231",
                      "primary": "#98FF98", 
                      "on-primary": "#001a42",
                      "tertiary-fixed-dim": "#fbbc00",
                      "on-background": "#181c24",
                      "on-secondary-container": "#0a7147",
                      "primary-fixed": "#d8e2ff",
                      "on-primary-fixed": "#001a42",
                      "error-container": "#ffdad6",
                      "inverse-on-surface": "#edf0fc",
                      "on-tertiary-container": "#a97e00",
                      "background": "#f9f9ff",
                      "on-tertiary-fixed-variant": "#5c4300",
                      "secondary-fixed-dim": "#80d8a5",
                      "outline": "#75777f",
                      "inverse-primary": "#b1c6f9",
                      "surface-tint": "#495e8a",
                      "surface": "#f9f9ff",
                      "surface-container-low": "#f0f3ff",
                      "surface-container-lowest": "#ffffff",
                      "on-primary-fixed-variant": "#314671",
                      "on-tertiary-fixed": "#261a00",
                      "surface-bright": "#f9f9ff",
                      "outline-variant": "#c5c6d0",
                      "secondary": "#006d43",
                      "on-secondary": "#ffffff",
                      "inverse-surface": "#2c3039",
                      "error": "#ba1a1a",
                      "tertiary-fixed": "#ffdfa0",
                      "surface-container-highest": "#dfe2ed",
                      "on-error-container": "#93000a",
                      "on-surface-variant": "#44474f",
                      "primary-container": "#001b44",
                      "primary-fixed-dim": "#b1c6f9",
                      "surface-container": "#ebedf9",
                      "on-error": "#ffffff",
                      "secondary-fixed": "#9cf5c0",
                      "tertiary-container": "#271b00",
                      "on-tertiary": "#ffffff",
                      "tertiary": "#040200",
                      "secondary-container": "#99f2bd",
                      "surface-dim": "#d7dae5",
                      "surface-variant": "#dfe2ed"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"
              },
              "spacing": {
                      "container-margin": "2rem", "stack-md": "1rem", "sidebar-width": "16rem", "stack-sm": "0.5rem", "header-height": "4rem", "grid-gutter": "1.5rem"
              },
              "fontFamily": {
                      "headline-md": [ "Manrope" ], "label-caps": [ "Inter" ], "title-sm": [ "Manrope" ], "display-lg": [ "Manrope" ], "body-md": [ "Inter" ]
              },
              "fontSize": {
                      "headline-md": [ "30px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" } ],
                      "label-caps": [ "10px", { "lineHeight": "1", "letterSpacing": "0.1em", "fontWeight": "700" } ],
                      "title-sm": [ "18px", { "lineHeight": "1.5", "fontWeight": "800" } ],
                      "display-lg": [ "72px", { "lineHeight": "1", "fontWeight": "800" } ],
                      "body-md": [ "14px", { "lineHeight": "1.6", "fontWeight": "400" } ]
              }
            },
          },
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col antialiased text-on-surface font-body-md text-body-md w-full mx-auto overflow-x-hidden justify-center items-center">

<main class="flex items-center justify-center p-container-margin w-full min-h-screen relative">
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 flex justify-center items-center opacity-30">
        <div class="w-[800px] h-[800px] bg-primary-fixed-dim rounded-full mix-blend-multiply filter blur-[120px] opacity-20 absolute top-[-20%] left-[-10%]"></div>
        <div class="w-[600px] h-[600px] bg-surface-tint rounded-full mix-blend-multiply filter blur-[100px] opacity-10 absolute bottom-[-10%] right-[-10%]"></div>
    </div>

    <div class="glass-panel w-full max-w-md rounded-xl p-8 z-10 relative flex flex-col gap-stack-md border border-outline-variant/30">
        <div class="flex flex-col items-center text-center mb-4">
            <div class="w-12 h-12 bg-primary-container rounded-lg flex items-center justify-center mb-4 shadow-sm">
                <span class="material-symbols-outlined text-white" data-weight="fill" style='font-variation-settings: "FILL" 1;'>lock_reset</span>
            </div>
            <h1 class="font-headline-md text-headline-md text-on-surface mb-2">Esqueci minha senha</h1>
            <p class="text-on-surface-variant max-w-sm mx-auto">Insira seu e-mail abaixo para receber as instruções de recuperação de acesso.</p>
        </div>

        <form action="#" class="flex flex-col gap-4 w-full" id="recovery-form" method="POST" novalidate="">
            <div class="hidden mb-2 text-secondary flex items-center justify-center gap-2 transition-all text-center" id="success-alert">
                <span class="material-symbols-outlined text-[20px]">check_circle</span>
                <p class="font-body-md text-sm font-semibold">Código enviado com sucesso!</p>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">E-mail Corporativo</label>
                <div class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline">
                        <span class="material-symbols-outlined text-[20px]" id="email-icon">mail</span>
                    </div>
                    <input class="block w-full pl-10 pr-3 py-3 border border-outline-variant text-on-surface placeholder-outline focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all shadow-sm rounded-lg bg-background selection:bg-[#2563eb] selection:text-white" id="email" name="email" placeholder="operador@luxcommand.com" required="" type="email" spellcheck="false"/>
                </div>
                <div class="hidden mt-1.5" id="email-error-container">
                    <p class="text-red-500 text-[12px] font-semibold leading-normal" id="email-error"></p>
                </div>
            </div>

            <button class="w-full bg-primary-container text-white py-3 px-6 font-title-sm text-title-sm hover:bg-on-primary-fixed-variant hover:shadow-[0_4px_14px_0_rgba(0,27,68,0.25)] transition-all flex justify-center items-center gap-2 active:scale-[0.98] rounded-lg mt-2" type="submit">
                <span>Enviar código de Recuperação</span>
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </form>

        <div class="mt-2 text-center">
            <a class="text-primary-container font-title-sm text-[14px] hover:underline transition-all flex items-center justify-center gap-1 group" href="Login.html">
                <span class="material-symbols-outlined text-[16px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Voltar para o Login
            </a>
        </div>
    </div>
</main>

<script>
    const form = document.getElementById('recovery-form');
    const emailInput = document.getElementById('email');
    const emailError = document.getElementById('email-error');
    const errorContainer = document.getElementById('email-error-container');
    const successAlert = document.getElementById('success-alert');

    const validateEmail = (email) => {
        return String(email).toLowerCase().match(/^(([^<>()[\]\\.,;:\s@"]+(\.[^\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/);
    };

    const clearError = () => {
        emailInput.classList.remove('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
        emailInput.classList.add('border-outline-variant', 'focus:ring-primary-container', 'focus:border-transparent');
        errorContainer.classList.add('hidden');
    };

    const showError = (message) => {
        emailInput.classList.remove('border-outline-variant', 'focus:ring-primary-container', 'focus:border-transparent');
        emailInput.classList.add('border-red-500', 'focus:border-red-500', 'focus:ring-red-500');
        
        emailError.textContent = message;
        errorContainer.classList.remove('hidden');
    };

    emailInput.addEventListener('input', clearError);

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const emailValue = emailInput.value.trim();
        let isValid = true;

        if (!emailValue) {
            showError("O preenchimento do e-mail é obrigatório.");
            isValid = false;
        } else if (!validateEmail(emailValue)) {
            showError("Por favor, insira um endereço de e-mail válido.");
            isValid = false;
        }

        if (isValid) {
            successAlert.classList.remove('hidden');
            setTimeout(() => { successAlert.classList.add('hidden'); }, 3000);
            form.reset();
            clearError();
        }
    });
</script>
</body>
</html>
