<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "primary-container": "#001b44",
            "surface-container-low": "#f0f3ff",
            "outline-variant": "#c5c6d0",
            "outline": "#75777f",
            "on-surface-variant": "#44474f",
            "on-surface": "#181c24",
            "background": "#f4f6fa"
          }
        },
      },
    }
  </script>
</head>
<body class="flex items-center justify-center min-h-screen w-screen bg-background antialiased overflow-hidden p-4">

  <main class="w-full max-w-md bg-white rounded-xl shadow-lg border border-outline-variant/30 overflow-hidden">
    
    <div class="h-32 bg-primary-container relative overflow-hidden">
      <div class="absolute inset-0 opacity-20">
        <img alt="Poultry facility automation" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJjGf3tnQm8n7l3GllJKYRZ9AECCtpfQi0bnOeVPvDaQoJTOUtLCPNSEMweMjTXffavRgw1cjSlJ0AMlke9jIE1cp_OXV3pbTqk2xVCvUlsrm0PXQG32uHO3BQxjes7HTpYQ8frYYKRaEOSeoiq7VbJ6PDtIwaBJn-rNgEMe_BjEpnudQau51buCU6WBdECsLgUN8hrj5xXA0KPHrDnCNHqPDKds7i6Aaf3X7aq4QNOdfylUQlutzGJ6nibC9hvDrmVymioqGiQA">
      </div>
      <div class="absolute inset-0 bg-gradient-to-t from-primary-container to-transparent"></div>
      <div class="relative h-full flex flex-col justify-end p-8">
        <h2 class="font-['Manrope'] font-extrabold text-white text-xl">Bem-vindo a Granja</h2>
        <p class="text-slate-400 text-xs font-bold tracking-wider mt-1">SISTEMA DE MONITORAMENTO DE LUMINOSIDADE</p>
      </div>
    </div>

    <div class="p-8 space-y-6">
      <form class="space-y-5" id="login-form" novalidate>
        
        <div class="hidden text-red-500 text-sm font-semibold text-center py-2 bg-red-50 rounded-lg border border-red-200" id="general-error">
          E-mail ou senha incorretos
        </div>

        <div class="space-y-2">
          <label class="text-xs font-bold tracking-wider text-on-surface-variant" for="email">E-MAIL</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl">mail</span>
            <input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant/50 rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none text-sm" id="email" name="email" placeholder="nome@empresa.com.br" type="email">
          </div>
          <p class="hidden text-red-500 text-xs mt-1 font-medium" id="email-error">O preenchimento do e-mail é obrigatório.</p>
          <p class="hidden text-red-500 text-xs mt-1 font-medium" id="email-format-error">Por favor, insira um endereço de e-mail válido.</p>
        </div>

        <div class="space-y-2">
          <div class="flex justify-between items-center">
            <label class="text-xs font-bold tracking-wider text-on-surface-variant" for="password">SENHA</label>
            <a class="text-xs font-semibold text-primary-container hover:underline" href="EsqueciSenha.html">Esqueci minha senha</a>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-xl">lock</span>
            <input class="w-full pl-10 pr-12 py-3 bg-surface-container-low border border-outline-variant/50 rounded-lg focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none text-sm" id="password" name="password" placeholder="••••••••" type="password">
            <button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" id="toggle-password" type="button">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
          <p class="hidden text-red-500 text-xs mt-1 font-medium" id="password-error">O preenchimento da senha é obrigatório.</p>
        </div>

        <div class="flex items-center">
          <input class="w-4 h-4 text-primary-container border-outline-variant rounded focus:ring-primary-container" id="remember" name="remember" type="checkbox">
          <label class="ml-2 text-sm text-on-surface-variant" for="remember">Lembrar de mim</label>
        </div>

        <button class="w-full bg-primary-container text-white font-bold py-4 rounded-xl hover:shadow-lg hover:shadow-primary-container/20 active:scale-[0.98] transition-all" type="submit">
          Entrar
        </button>
      </form>

      <div class="pt-4 border-t border-outline-variant/20">
        <p class="text-center text-xs text-on-surface-variant">Não possui uma conta? <a class="font-bold text-primary-container hover:underline" href="CriarConta.html">Criar conta</a></p>
      </div>
    </div>
  </main>

  <script>
    function id(str) { return document.getElementById(str); }

    const togglePassword = id('toggle-password');
    const passwordInput = id('password');
    const passwordIcon = togglePassword.querySelector('span');

    const form = id('login-form');
    const emailInput = id('email');
    const emailError = id('email-error');
    const emailFormatError = id('email-format-error');
    const passwordError = id('password-error');
    const generalError = id('general-error');

    // Alternar visibilidade da senha
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      passwordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
    });

    // Limpar erros de E-mail ao digitar
    emailInput.addEventListener('input', () => {
      emailError.classList.add('hidden');
      emailFormatError.classList.add('hidden');
      generalError.classList.add('hidden');
      emailInput.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
    });

    // Limpar erros de Senha ao digitar
    passwordInput.addEventListener('input', () => {
      passwordError.classList.add('hidden');
      generalError.classList.add('hidden');
      passwordInput.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
    });

    // Submissão do Formulário e Validações
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      
      let hasError = false;
      const emailValue = emailInput.value.trim();
      const passwordValue = passwordInput.value.trim();
      
      // Limpar estados anteriores
      emailError.classList.add('hidden');
      emailFormatError.classList.add('hidden');
      passwordError.classList.add('hidden');
      generalError.classList.add('hidden');
      emailInput.classList.remove('border-red-500', 'ring-1', 'ring-red-500');
      passwordInput.classList.remove('border-red-500', 'ring-1', 'ring-red-500');

      // Validar E-mail
      if (!emailValue) {
        emailError.classList.remove('hidden');
        emailInput.classList.add('border-red-500', 'ring-1', 'ring-red-500');
        hasError = true;
      } else if (!emailValue.includes('@') || !emailValue.includes('.')) {
        emailFormatError.classList.remove('hidden');
        emailInput.classList.add('border-red-500', 'ring-1', 'ring-red-500');
        hasError = true;
      }

      // Validar Senha vazia
      if (!passwordValue) {
        passwordError.classList.remove('hidden');
        passwordInput.classList.add('border-red-500', 'ring-1', 'ring-red-500');
        hasError = true;
      }

      if (!hasError) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
