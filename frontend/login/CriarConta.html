<!DOCTYPE html>
<html class="light" lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>LuxCommand - Criar Conta</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-container-lowest": "#ffffff",
            "primary-container": "#001b44",
            "outline-variant": "#c5c6d0",
            "outline": "#75777f",
            "on-surface-variant": "#44474f",
            "on-surface": "#181c24",
            "background": "#f4f6fa"
          }
        },
      },
    }
    
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen w-screen flex items-center justify-center antialiased overflow-y-auto p-4 sm:p-6">

  <main class="w-full max-w-[480px] my-auto transition-all duration-300">
    <div class="bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 overflow-hidden">
      <div class="p-8 sm:p-10">
        
        <div class="text-center mb-8">
          <h1 class="font-['Manrope'] font-extrabold text-3xl text-on-surface tracking-tight">Criar sua conta</h1>
          <p class="text-on-surface-variant text-sm mt-2">Preencha os dados abaixo para começar.</p>
        </div>

        <form action="index.html" class="space-y-2" id="register-form" novalidate>
          
          <div class="flex flex-col space-y-1.5 relative pb-5">
            <label class="text-[11px] font-bold tracking-wider text-on-surface-variant uppercase">Nome Completo</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
              <input class="w-full pl-12 pr-4 py-3 bg-[#f0f3ff] border border-outline-variant/40 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none text-on-surface text-sm" id="name" placeholder="Seu nome completo" type="text"/>
            </div>
          </div>

          <div class="flex flex-col space-y-1.5 relative pb-5">
            <label class="text-[11px] font-bold tracking-wider text-on-surface-variant uppercase">E-mail</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
              <input class="w-full pl-12 pr-4 py-3 bg-[#f0f3ff] border border-outline-variant/40 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none text-on-surface text-sm" id="email" placeholder="seu@email.com" type="email"/>
            </div>
          </div>

          <div class="flex flex-col space-y-1.5 relative pb-5">
            <label class="text-[11px] font-bold tracking-wider text-on-surface-variant uppercase">Senha</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
              <input class="w-full pl-12 pr-12 py-3 bg-[#f0f3ff] border border-outline-variant/40 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none text-on-surface text-sm" id="password" placeholder="••••••••" type="password"/>
              <button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors toggle-password" data-target="password" type="button">
                <span class="material-symbols-outlined text-[20px]">visibility</span>
              </button>
            </div>
          </div>

          <div class="flex flex-col space-y-1.5 relative pb-5">
            <label class="text-[11px] font-bold tracking-wider text-on-surface-variant uppercase">Confirmar Senha</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
              <input class="w-full pl-12 pr-12 py-3 bg-[#f0f3ff] border border-outline-variant/40 rounded-xl focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all outline-none text-on-surface text-sm" id="confirm-password" placeholder="••••••••" type="password"/>
              <button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors toggle-password" data-target="confirm-password" type="button">
                <span class="material-symbols-outlined text-[20px]">visibility</span>
              </button>
            </div>
          </div>

          <div class="pt-2">
            <button class="w-full py-3.5 bg-[#001B44] text-white rounded-xl font-bold text-base hover:opacity-95 active:scale-[0.98] transition-all shadow-lg shadow-[#001B44]/15" type="submit">
              Criar Conta
            </button>
          </div>
        </form>

        <div class="mt-8 text-center">
          <p class="text-sm text-on-surface-variant">
            Já tem uma conta? 
            <a class="text-primary-container font-semibold hover:underline decoration-2 underline-offset-4" href="Login.html">Entrar</a>
          </p>
        </div>

      </div>
    </div>
  </main>

  <script>
    function id(str) { return document.getElementById(str); }

    const form = id('register-form');
    const nameInput = id('name');
    const emailInput = id('email');
    const passInput = id('password');
    const confirmInput = id('confirm-password');

    const errorClasses = ['border-red-500', 'focus:ring-red-500'];

    // Alternar visibilidade das senhas
    document.querySelectorAll('.toggle-password').forEach(button => {
      button.addEventListener('click', () => {
        const targetId = button.getAttribute('data-target');
        const inputField = id(targetId);
        const icon = button.querySelector('span');
        
        if (inputField.type === 'password') {
          inputField.type = 'text';
          icon.textContent = 'visibility_off';
        } else {
          inputField.type = 'password';
          icon.textContent = 'visibility';
        }
      });
    });

    // Função modificada com 'absolute bottom-0' para o texto flutuar sem alterar o tamanho do card
    const showError = (input, message) => {
      const container = input.closest('.flex');
      input.classList.add(...errorClasses);
      
      let errorMsg = container.querySelector('.error-message');
      if (!errorMsg) {
        errorMsg = document.createElement('p');
        // 'absolute bottom-0' impede que o texto empurre os outros elementos
        errorMsg.className = 'error-message text-red-500 text-xs font-medium absolute bottom-0 left-0';
        container.appendChild(errorMsg);
      }
      errorMsg.textContent = message;
    };

    const clearError = (input) => {
      const container = input.closest('.flex');
      input.classList.remove(...errorClasses);
      const errorMsg = container.querySelector('.error-message');
      if (errorMsg) errorMsg.remove();
    };

    [nameInput, emailInput, passInput, confirmInput].forEach(input => {
      input.addEventListener('input', () => {
        clearError(input);
        if (input === passInput || input === confirmInput) {
          passInput.classList.remove(...errorClasses);
          confirmInput.classList.remove(...errorClasses);
        }
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let isValid = true;

      const nameValue = nameInput.value.trim();
      const emailValue = emailInput.value.trim();
      const passValue = passInput.value;
      const confirmValue = confirmInput.value;

      [nameInput, emailInput, passInput, confirmInput].forEach(clearError);

      if (!nameValue) {
        showError(nameInput, 'O preenchimento do nome é obrigatório.');
        isValid = false;
      }

      if (!emailValue) {
        showError(emailInput, 'O preenchimento do e-mail é obrigatório.');
        isValid = false;
      } else if (!emailValue.includes('@')) {
        showError(emailInput, 'Por favor, insira um endereço de e-mail válido.');
        isValid = false;
      }

      if (!passValue) {
        showError(passInput, 'O preenchimento da senha é obrigatório.');
        isValid = false;
      }

      if (!confirmValue) {
        showError(confirmInput, 'A confirmação da senha é obrigatória.');
        isValid = false;
      } else if (confirmValue !== passValue) {
        showError(confirmInput, 'As senhas não coincidem. Elas devem ser idênticas.');
        passInput.classList.add(...errorClasses);
        isValid = false;
      }

      if (isValid) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
